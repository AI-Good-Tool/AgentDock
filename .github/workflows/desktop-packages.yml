name: Desktop packages

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'vendor/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/desktop-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: AgentDock-windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: AgentDock-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: AgentDock-macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      # Tests must never touch real client data or start background account actions.
      AGENTDOCK_NO_TASKS: '1'
      AGENTDOCK_SKIP_MIGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Offline tests and frontend build
        run: |
          # official_transport tests drive a locally installed WorkBuddy client, which CI runners lack.
          cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace -- --skip official_transport::tests
          npm run build
      - name: Build installer
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Collect installer and checksum
        run: node scripts/collect-ci-packages.mjs "${{ matrix.target }}" "${{ matrix.bundle }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ci-packages/*
          if-no-files-found: error
          retention-days: 14
