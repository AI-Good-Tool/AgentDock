[package]
name = "agentdock-trae"
version = "0.3.2"
edition = "2021"
description = "AgentDock Trae provider (Rust port of Trae Switch)"

[lib]
name = "trae"
path = "src/lib.rs"

[features]
fixtures = []

[dependencies]
agentdock-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
futures-util = "0.3"
async-stream = "0.3"
http = "1"
crc32fast = "1"
imagesize = "0.13"
fs2 = "0.4"
