[package]
name = "agentdock-core"
version = "1.0.0"
edition = "2021"
description = "AgentDock shared protocol conversion, diagnostics and provider types"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = "0.4"
futures-util = "0.3"
http = "1"
