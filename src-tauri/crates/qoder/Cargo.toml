[package]
name = "agentdock-qoder"
version = "1.8.0"
edition = "2021"
description = "AgentDock Qoder provider (accounts, switching, daily credits, sessions, gateway transport)"

[lib]
name = "qoder"
path = "src/lib.rs"

[features]
fixtures = []

[dependencies]
agentdock-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
async-stream = "0.3"
http = "1"

[dev-dependencies]
axum = "0.8"
